
name: currency-converter

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: currency-converter-api:local
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "false"
      LOG_LEVEL: INFO

      EXCHANGE_PROVIDER: frankfurter
      EXCHANGE_API: https://api.frankfurter.app/latest
      EXCHANGE_TIMEOUT_SECONDS: "5"
      EXCHANGE_MAX_RETRIES: "2"

      DATABASE_URL: postgresql+psycopg://currency:currency_dev_only@postgres:5432/currency_converter
      REDIS_URL: redis://redis:6379/0

      API_KEY_AUTH_ENABLED: "false"
      API_KEY_PEPPER: ${API_KEY_PEPPER:-local-only-change-this-pepper}

      METRICS_ENABLED: "true"
      METRICS_PATH: /metrics

      RATE_CACHE_TTL_SECONDS: "3600"
      MAX_STALE_RATE_AGE_SECONDS: "86400"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend
      - monitoring

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: currency_converter
      POSTGRES_USER: currency
      POSTGRES_PASSWORD: currency_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U currency -d currency_converter
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      app:
        condition: service_healthy
    networks:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  backend:
    internal: true
  monitoring: