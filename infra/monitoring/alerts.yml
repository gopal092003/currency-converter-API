
groups:
  - name: currency-converter-availability
    rules:
      - alert: CurrencyConverterTargetDown
        expr: up{job="currency-converter-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: currency-converter
        annotations:
          summary: Currency Converter API metrics target is down
          description: Prometheus has been unable to scrape the API for at least 2 minutes.

      - alert: CurrencyConverterHighServerErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="currency-converter-api",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="currency-converter-api"}[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: currency-converter
        annotations:
          summary: API server error rate is elevated
          description: More than 5% of observed requests are returning 5xx responses for 5 minutes.

      - alert: CurrencyConverterHighRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="currency-converter-api"}[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: currency-converter
        annotations:
          summary: API p95 latency is elevated
          description: The p95 request latency has exceeded 1 second for 10 minutes.

  - name: currency-converter-upstream
    rules:
      - alert: CurrencyConverterProviderFailures
        expr: |
          sum(rate(provider_requests_total{job="currency-converter-api",status="error"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          service: currency-converter
        annotations:
          summary: Exchange-rate provider failures are elevated
          description: Provider failures are exceeding 0.2 requests per second for 5 minutes.

      - alert: CurrencyConverterRateLimitStorageFailures
        expr: |
          sum(rate(rate_limit_storage_errors_total{job="currency-converter-api"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: currency-converter
        annotations:
          summary: Rate-limit storage errors detected
          description: The application has reported rate-limit storage errors for at least 2 minutes.

      - alert: CurrencyConverterStaleRates
        expr: |
          max(rate_freshness_age_seconds{job="currency-converter-api"}) > 86400
        for: 10m
        labels:
          severity: warning
          service: currency-converter
        annotations:
          summary: Exchange rates are older than the configured threshold
          description: A tracked rate observation is older than 24 hours.
